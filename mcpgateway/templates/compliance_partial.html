<!-- Compliance & Audit Dashboard - Plain JS -->
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Compliance & Audit Dashboard</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Generate compliance reports and monitor policy decisions</p>
        </div>
    </div>

    <!-- Framework Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <button onclick="complianceGenerate('fedramp_moderate')" class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 border-l-4 border-blue-500 hover:shadow-md transition text-left">
            <span class="font-semibold text-sm">🏛️ FedRAMP</span>
            <p class="text-xs text-gray-500 mt-1">Federal authorization</p>
        </button>
        <button onclick="complianceGenerate('hipaa')" class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 border-l-4 border-green-500 hover:shadow-md transition text-left">
            <span class="font-semibold text-sm">🏥 HIPAA</span>
            <p class="text-xs text-gray-500 mt-1">Healthcare compliance</p>
        </button>
        <button onclick="complianceGenerate('soc2_type2')" class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 border-l-4 border-purple-500 hover:shadow-md transition text-left">
            <span class="font-semibold text-sm">🔒 SOC2</span>
            <p class="text-xs text-gray-500 mt-1">Service org controls</p>
        </button>
        <button onclick="complianceGenerate('fedramp_high')" class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 border-l-4 border-orange-500 hover:shadow-md transition text-left">
            <span class="font-semibold text-sm">🏛️ FedRAMP High</span>
            <p class="text-xs text-gray-500 mt-1">High impact systems</p>
        </button>
    </div>

    <!-- Error -->
    <div id="compliance-error" class="bg-red-50 border border-red-200 rounded-lg p-3 text-sm text-red-700 hidden"></div>

    <!-- Report Result -->
    <div id="compliance-report" class="bg-white dark:bg-gray-800 rounded-lg shadow hidden">
        <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
            <h4 class="font-semibold text-sm" id="report-title"></h4>
            <span class="text-xs text-gray-500" id="report-date"></span>
        </div>
        <div class="px-4 py-3">
            <div class="flex justify-between text-xs mb-1">
                <span class="text-gray-500">Compliance Score</span>
                <span class="font-bold" id="report-score"></span>
            </div>
            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3">
                <div class="h-3 rounded-full transition-all duration-500" id="report-bar"></div>
            </div>
        </div>
        <div class="px-4 pb-3 grid grid-cols-3 gap-2 text-center">
            <div class="p-2 bg-green-50 dark:bg-green-900/20 rounded"><div class="text-lg font-bold text-green-600" id="count-satisfied">0</div><div class="text-xs text-gray-500">Satisfied</div></div>
            <div class="p-2 bg-yellow-50 dark:bg-yellow-900/20 rounded"><div class="text-lg font-bold text-yellow-600" id="count-partial">0</div><div class="text-xs text-gray-500">Partial</div></div>
            <div class="p-2 bg-red-50 dark:bg-red-900/20 rounded"><div class="text-lg font-bold text-red-600" id="count-failed">0</div><div class="text-xs text-gray-500">Not Satisfied</div></div>
        </div>
        <div class="px-4 pb-4">
            <div class="max-h-60 overflow-y-auto">
                <table class="min-w-full text-xs">
                    <thead class="bg-gray-50 dark:bg-gray-900 sticky top-0"><tr><th class="px-2 py-1 text-left font-medium text-gray-500">Control</th><th class="px-2 py-1 text-left font-medium text-gray-500">Status</th><th class="px-2 py-1 text-left font-medium text-gray-500">Evidence</th></tr></thead>
                    <tbody id="controls-body" class="divide-y divide-gray-100 dark:divide-gray-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Report History -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow">
        <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700"><h4 class="font-semibold text-sm">Report History</h4></div>
        <div id="report-history" class="p-6 text-center text-sm text-gray-500">No reports yet. Click a framework above.</div>
    </div>
</div>
